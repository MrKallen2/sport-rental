server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: rentals-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/app}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:1234}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 5000
  sql:
    init:
      mode: always

clients:
  users:
    url: ${USERS_SERVICE_URL:http://localhost:8081}
  equipment:
    url: ${EQUIPMENT_SERVICE_URL:http://localhost:8082}
  notifications:
    url: ${NOTIFICATIONS_SERVICE_URL:http://localhost:8084}

logging:
  level:
    root: INFO
    com.sportrental: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
